# 云端构建 APK（本机无 Android SDK 时使用）
# 用法：把整个 lottery-analyzer 文件夹上传到 GitHub 仓库根目录，push 后自动构建；
# 也可在 Actions 页手动 Run workflow。构建完成后在运行详情页 Artifacts 下载 APK。
# 注意：若仓库根目录就是 lottery-analyzer 的内容本身（即 android/ 直接在根下），
#       请把下面 working-directory 与 path 中的 "lottery-analyzer/" 前缀去掉。
name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 显式安装 Gradle 8.7（AGP 8.5.2 要求 ≥8.7），并启用依赖缓存加速
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 构建 Debug APK
        working-directory: lottery-analyzer/android
        run: gradle assembleDebug --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: lottery-analyzer-debug-apk
          path: lottery-analyzer/android/app/build/outputs/apk/debug/app-debug.apk
