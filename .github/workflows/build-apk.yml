name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 构建 Debug APK
        working-directory: lottery-analyzer/android
        run: gradle assembleDebug --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: lottery-analyzer-debug-apk
          path: lottery-analyzer/android/app/build/outputs/apk/debug/app-debug.apk
